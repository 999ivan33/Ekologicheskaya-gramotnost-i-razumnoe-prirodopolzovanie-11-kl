      margin: 0;
      padding: 0;
      -webkit-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
      user-select: none !important;
      -webkit-touch-callout: none !important;
      -webkit-tap-highlight-color: transparent;
    }

    body {

      color: var(--text-main);

      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top, 16px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 16px) env(safe-area-inset-left, 16px);
      overflow-x: hidden;
    }

    .hud-container {
      width: 100%;
      max-width: 720px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 24px;
      box-shadow: var(--shadow-hud);
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
    }

    .hud-header {
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 16px;
    }

    .hud-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tactical-badge {
      background: rgba(2, 132, 199, 0.15);
      color: var(--accent-sky);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .counter-display {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .counter-display span {
      color: var(--accent-sky);
      font-size: 1.15rem;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: #111827;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-sky));
      transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .stage-wrapper {
      min-height: 320px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .card-step {
      display: flex;
      flex-direction: column;
      gap: 20px;
      animation: stageFadeIn 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes stageFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .question-box {
      background: var(--bg-card);
      border: 2px solid var(--border-subtle);
      border-radius: 16px;
      padding: 28px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .step-tag {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent-sky);
      font-weight: 700;
    }

    .question-text {
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.45;
      color: var(--text-main);
    }

    .btn-action-primary {
      background: linear-gradient(135deg, var(--accent-blue), #0369a1);
      color: #ffffff;
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 14px;
      padding: 16px 20px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
    }

    .btn-action-primary:active {
      transform: scale(0.98);
    }

    .btn-action-secondary {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .btn-action-secondary:active {
      background: var(--bg-card);
      color: var(--text-main);
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .option-btn {
      background: var(--bg-card);
      border: 2px solid var(--border-subtle);
      border-radius: 14px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      text-align: left;
      transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;

    .option-btn:active {
      transform: scale(0.98);
      border-color: var(--accent-sky);
      background: var(--bg-card-hover);
    }

      flex-shrink: 0;

      height: 36px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: var(--accent-sky);
      font-size: 1rem;
    }

    .option-label {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.35;
      color: var(--text-main);

      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;

      align-items: center;

      font-weight: 900;

    .score-grade-text {

      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.05em;

      border-radius: 14px;

      gap: 16px;

    .stat-box {

      flex-direction: column;
      gap: 4px;

    .stat-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;

      font-weight: 800;
      color: var(--text-main);

      font-weight: 600;
      line-height: 1.5;
      color: var(--text-muted);

        border-radius: 16px;

      }
      .option-btn {
        padding: 14px;
      }
      .option-label {
        font-size: 0.95rem;
      }
    }
  </style>
</head>

      function fisherYates(arr) {
        var a = arr.slice();
        for (var i = a.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var temp = a[i];
          a[i] = a[j];
          a[j] = temp;
        }
        return a;
      }

      var sessionQuestions = [];
      var currentIndex = 0;
      var currentStep = 1;
      var answersLog = [];
      var securityArmed = false;
      var testDone = false;

      var stageWrapper = document.getElementById("stageWrapper");
      var hudCounter = document.getElementById("hudCounter");
      var progressFill = document.getElementById("progressFill");
      var blackoutOverlay = document.getElementById("blackoutOverlay");

      function initTest() {
        var pool = fisherYates(FULL_QUESTION_BANK);
        var chosen = pool.slice(0, 20);

        sessionQuestions = chosen.map(function (item) {
          var mapped = item.options.map(function (optText, idx) {
            return { text: optText, correct: idx === item.ans };
          });
          var shuffledOpts = fisherYates(mapped);
          var correctIdx = shuffledOpts.findIndex(function (o) { return o.correct; });

          return {
            q: item.q,
            options: shuffledOpts.map(function (o) { return o.text; }),
            ans: correctIdx
          };
        });

        currentIndex = 0;
        currentStep = 1;
        answersLog = new Array(20).fill(null);
        testDone = false;
        securityArmed = false;

        renderCurrentQuestion();

        setTimeout(function () {
          securityArmed = true;
        }, 1200);
      }

      function updateHud() {
        var num = currentIndex + 1;
        hudCounter.innerHTML = "ВОПРОС: <span>" + num + "</span> / 20";
        var pct = (currentIndex / 20) * 100;
        progressFill.style.width = pct + "%";
      }

      function renderCurrentQuestion() {
        if (currentIndex >= 20) {
          finishTest();
          return;
        }

        updateHud();
        var qData = sessionQuestions[currentIndex];

        if (currentStep === 1) {
          stageWrapper.innerHTML =
            '<div class="card-step">' +
              '<div class="question-box">' +
                '<span class="step-tag">Шаг 1 из 2 • Анализ ситуации</span>' +
                '<h2 class="question-text" id="activeQuestionText">' + qData.q + '</h2>' +
              '</div>' +
              '<button class="btn-action-primary" id="btnGoOptions">' +
                '<span>Перейти к вариантам ответов</span>' +
                '<span>➔</span>' +
              '</button>' +
            '</div>';

          document.getElementById("btnGoOptions").addEventListener("click", function () {
            currentStep = 2;
            renderCurrentQuestion();
          });
        } else {
          var letters = ["А", "Б", "В", "Г"];
          var optionsHtml = qData.options.map(function (optText, idx) {
            return (
              '<button class="option-btn" data-index="' + idx + '">' +
                '<div class="option-badge">' + letters[idx] + '</div>' +
                '<div class="option-label">' + optText + '</div>' +
              '</button>'
            );
          }).join("");

          stageWrapper.innerHTML =
            '<div class="card-step">' +
              '<div class="options-grid">' +
                optionsHtml +
              '</div>' +
              '<button class="btn-action-secondary" id="btnBackQuestion">' +
                '<span>⬅</span>' +
                '<span>Вернуться к чтению вопроса</span>' +
              '</button>' +
            '</div>';

          document.getElementById("btnBackQuestion").addEventListener("click", function () {
            currentStep = 1;
            renderCurrentQuestion();
          });

          var btns = stageWrapper.querySelectorAll(".option-btn");
          btns.forEach(function (btn) {
            btn.addEventListener("click", function () {
              var selectedIdx = parseInt(btn.getAttribute("data-index"), 10);
              recordAnswerAndAdvance(selectedIdx);
            });
          });
        }
      }

      function recordAnswerAndAdvance(choiceIndex) {
        var isCorrect = (choiceIndex === sessionQuestions[currentIndex].ans);
        answersLog[currentIndex] = {
          awarded: isCorrect ? 1 : 0,
          burned: false
        };

        advanceNext();
      }

      function advanceNext() {
        currentIndex++;
        currentStep = 1;
        if (currentIndex < 20) {
          renderCurrentQuestion();
        } else {
          finishTest();
        }
      }

      function burnCurrentQuestion() {
        if (testDone || !securityArmed || currentIndex >= 20) return;

        answersLog[currentIndex] = {
          awarded: 0,
          burned: true
        };

        var qEl = document.getElementById("activeQuestionText");
        if (qEl) qEl.textContent = "";

        blackoutOverlay.style.display = "flex";

        setTimeout(function () {
          blackoutOverlay.style.display = "none";
          advanceNext();
        }, 1800);
      }

      function finishTest() {
        testDone = true;
        progressFill.style.width = "100%";
        hudCounter.innerHTML = "АТТЕСТАЦИЯ ЗАВЕРШЕНА";

        var totalCorrect = answersLog.reduce(function (sum, item) {
          return sum + (item && item.awarded ? item.awarded : 0);
        }, 0);

        var pct = Math.round((totalCorrect / 20) * 100);

        var grade = "2";
        var gradeColor = "var(--accent-red)";
        var gradeText = "Порог не пройден";
        var verdict = "Экологическая грамотность на базовом уровне не подтверждена. Требуется глубокое изучение циркулярной экономики, анализа жизненного цикла и принципов природопользования.";

        if (totalCorrect >= 19) {
          grade = "5";
          gradeColor = "var(--accent-green)";
          gradeText = "Отлично";
          verdict = "Блестящий результат системного мышления! Продемонстрировано безупречное понимание замкнутых циклов, промышленного симбиоза, ESG-трансформации и биомимикрии.";
        } else if (totalCorrect >= 15) {
          grade = "4";
          gradeColor = "var(--accent-sky)";
          gradeText = "Хорошо";
          verdict = "Уверенное владение современной экологической повесткой. Зафиксированы точечные неточности в вопросах углеродного аудита и материалоемкости технологий.";
        } else if (totalCorrect >= 11) {
          grade = "3";
          gradeColor = "var(--accent-amber)";
          gradeText = "Удовлетворительно";
          verdict = "Базовый уровень освоен, однако присутствуют пробелы в понимании разницы между рециклингом и апсайклингом, замкнутым ядерным топливным циклом и стандартами Scope 1-3.";
        }

        stageWrapper.innerHTML =
          '<div class="result-container">' +
            '<div class="score-circle-wrapper">' +
              '<div class="score-ring" style="border-color: ' + gradeColor + '; color: ' + gradeColor + ';">' +
                '<span class="score-grade-number">' + grade + '</span>' +
                '<span class="score-grade-text">' + gradeText + '</span>' +
              '</div>' +
            '</div>' +
            '<div class="result-stats-card">' +
              '<div class="stat-box">' +
                '<span class="stat-label">Верных ответов</span>' +
                '<span class="stat-value" style="color: ' + gradeColor + ';">' + totalCorrect + ' / 20</span>' +
              '</div>' +
              '<div class="stat-box">' +
                '<span class="stat-label">Процент освоения</span>' +
                '<span class="stat-value">' + pct + '%</span>' +
              '</div>' +
            '</div>' +
            '<p class="review-verdict">' + verdict + '</p>' +
            '<button class="btn-action-primary" style="width: 100%; margin-top: 10px;" id="btnRestart">' +
              'Пройти повторно (Новая генерация 20 заданий)' +
            '</button>' +
          '</div>';

        document.getElementById("btnRestart").addEventListener("click", function () {
          initTest();
        });
      }

      window.addEventListener("blur", function () {
        burnCurrentQuestion();
      });

      document.addEventListener("visibilitychange", function () {
        if (document.hidden) {
          burnCurrentQuestion();
        }
      });

      window.addEventListener("contextmenu", function (e) {
        e.preventDefault();
        return false;
      });

      window.addEventListener("keydown", function (e) {
        if (e.key === "F12") {
          e.preventDefault();
          return false;
        }
        if (e.ctrlKey || e.metaKey) {
          var k = e.key.toLowerCase();
          if (["c", "u", "s", "p", "a"].indexOf(k) !== -1) {
            e.preventDefault();
            return false;
          }
          if (e.shiftKey && ["i", "j", "c"].indexOf(k) !== -1) {
            e.preventDefault();
            return false;
          }
        }
      });

      initTest();
    })();
